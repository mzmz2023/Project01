# ============================================================
# 电影推荐系统 — 模型超参数配置
# ============================================================
# 使用方式：训练脚本通过 load_config("configs/model_config.yaml") 读取
# ============================================================

# ---------------------------
# 数据预处理参数
# ---------------------------
data:
  # 用户最少评分次数（低于此值视为噪声，过滤掉）
  min_user_ratings: 5
  # 电影最少被评次数（低于此值视为冷门，过滤掉）
  min_movie_ratings: 10
  # 测试集比例
  test_size: 0.2
  # 从训练集中划分验证集的比例（占原始数据比例）
  val_size: 0.05
  # 随机种子（保证可复现）
  random_state: 42

# ---------------------------
# ItemCF（基于物品的协同过滤）
# ---------------------------
itemcf:
  # 相似邻居数：取与目标电影最相似的 top_k 个电影做加权预测
  top_k: 10

# ---------------------------
# ALS（交替最小二乘矩阵分解）
# ---------------------------
als:
  # 嵌入向量维度（越大拟合能力越强，但过拟合风险也越大）
  n_factors: 64
  # 学习率
  lr: 0.002
  # 训练轮数
  epochs: 15
  # 批次大小（受GPU显存限制）
  batch_size: 16384
  # 权重衰减系数（L2正则化，防止过拟合）
  weight_decay: 0.00001
  # 学习率调度器：验证RMSE停止下降几轮后衰减
  scheduler_patience: 2
  # 学习率衰减因子
  scheduler_factor: 0.5
  # 早停：验证RMSE连续几轮不下降则停止训练
  early_stop_patience: 2

# ---------------------------
# 评估参数
# ---------------------------
eval:
  # RMSE评估时的采样数量（全量评估太慢，采样子集）
  sample_size: 100000
